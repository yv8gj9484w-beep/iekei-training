<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>家系ラーメン お好み記憶トレーニング</title>
<style>
:root{--red:#b91c1c;--red2:#991b1b;--bg:#f3efe5;--card:#fff;--ticket:#fff7d6;--line:#dfb94a;--text:#191919;--muted:#6b7280}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:760px;margin:auto;padding:12px 12px 36px}.hero{padding:18px;border-radius:18px;color:#fff;background:linear-gradient(135deg,#7f1d1d,#c81e1e);box-shadow:0 6px 18px #0002}.hero small{font-weight:900;letter-spacing:.14em}.hero h1{font-size:clamp(22px,6vw,31px);margin:5px 0}.hero p{margin:0;opacity:.9;font-size:14px}.panel{background:var(--card);border-radius:18px;padding:14px;margin-top:12px;box-shadow:0 4px 16px #0001}.people{font-size:28px;font-weight:900}.state{font-size:14px;color:var(--muted);margin:2px 0 12px}.orders{display:grid;gap:11px}.ticket{background:var(--ticket);border:2px solid var(--line);border-left:7px solid var(--red);border-radius:14px;padding:13px 14px;box-shadow:0 2px 0 #c89f32}.top{display:flex;justify-content:space-between;gap:10px}.name{font-size:19px;font-weight:900}.person{font-size:12px;color:#777;font-weight:800;white-space:nowrap}.toppings{margin-top:7px}.tag{display:inline-block;background:#166534;color:#fff;font-size:12px;font-weight:800;border-radius:999px;padding:4px 8px;margin:2px 4px 2px 0}.none{font-size:12px;color:#777;font-weight:700}.pref{margin-top:8px;color:var(--red2);font-weight:900}.masked{color:#777;letter-spacing:.08em}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.btn{min-height:52px;border-radius:13px;padding:12px;border:0;font-size:16px;font-weight:900;cursor:pointer}.hide{background:#222;color:#fff}.show{background:#fff;border:2px solid #aaa}.next{grid-column:1/-1;background:var(--red);color:#fff}.guide{font-size:13px;line-height:1.7;color:#555;background:#f5f5f5;padding:12px;border-radius:12px;margin-top:14px}@media(max-width:380px){.wrap{padding:8px}.buttons{grid-template-columns:1fr}.next{grid-column:auto}.name{font-size:17px}}@media(prefers-color-scheme:dark){:root{--bg:#111;--card:#1f1f1f;--ticket:#302a17;--line:#a98531;--text:#f5f5f5;--muted:#bbb}.show{background:#292929;color:#fff;border-color:#666}.guide{background:#292929;color:#ddd}.person,.none{color:#bbb}}
</style>
</head><body><main class="wrap"><header class="hero"><small>家系ラーメン</small><h1>お好み記憶トレーニング</h1><p>食券・対応トッピング・お好みをセットで記憶</p></header><section class="panel"><div id="people" class="people"></div><div id="state" class="state" aria-live="polite"></div><div id="orders" class="orders"></div><div class="buttons"><button id="hide" class="btn hide" type="button">お好みを隠す</button><button id="show" class="btn show" type="button">答えを見る</button><button id="next" class="btn next" type="button">次の注文</button></div><div class="guide"><b>練習方法</b><br>1〜5名様がランダムで出題されます。山くらげ・のり・ほうれん草は、付いているラーメンのカード内に表示されます。ご飯・卵など、それ以外の食券は出題しません。</div></section></main>
<script>
(()=>{const ramen=['大ラーメン','中ラーメン','ラーメン','大チャーシューメン','中チャーシューメン','チャーシューメン'];const toppings=['山くらげ','のり','ほうれん草'];const $=s=>document.querySelector(s);let data=[],hidden=false,n=1;const pick=a=>a[Math.floor(Math.random()*a.length)];function makePrefs(){const v=[pick(['味こめ','ふつう','薄味']),pick(['多め','ふつう','少なめ']),pick(['かため','ふつう','やわらかめ'])];const r=[];if(v[0]!=='ふつう')r.push(v[0]);if(v[1]!=='ふつう')r.push(v[1]);if(v[2]!=='ふつう')r.push(v[2]);return r.length?r:['すべてふつう']}function makeToppings(){const r=[];toppings.forEach(t=>{if(Math.random()<.28)r.push(t)});return r}function generate(){n=Math.floor(Math.random()*5)+1;data=Array.from({length:n},(_,i)=>({person:i+1,ramen:pick(ramen),toppings:makeToppings(),prefs:makePrefs()}));hidden=false;render();$('#state').textContent='食券・トッピング・お好みを覚えてください。'}function render(){$('#people').textContent=n+'名様';const box=$('#orders');box.textContent='';data.forEach(o=>{const a=document.createElement('article');a.className='ticket';const top=document.createElement('div');top.className='top';const name=document.createElement('div');name.className='name';name.textContent=o.ramen;const person=document.createElement('div');person.className='person';person.textContent=o.person+'人目';top.append(name,person);a.append(top);const tr=document.createElement('div');tr.className='toppings';if(o.toppings.length){o.toppings.forEach(x=>{const s=document.createElement('span');s.className='tag';s.textContent='＋ '+x;tr.append(s)})}else{const s=document.createElement('span');s.className='none';s.textContent='追加トッピングなし';tr.append(s)}a.append(tr);const p=document.createElement('div');p.className='pref'+(hidden?' masked':'');p.textContent=hidden?'お好み：？？？':'お好み：'+o.prefs.join('・');a.append(p);box.append(a)})}$('#hide').addEventListener('click',()=>{hidden=true;render();$('#state').textContent='食券とトッピングを見て、お好みを思い出してください。'});$('#show').addEventListener('click',()=>{hidden=false;render();$('#state').textContent='答え合わせです。'});$('#next').addEventListener('click',generate);generate()})();
</script></body></html>
